<!doctype html>
<html lang="ar" dir="rtl" data-no-intro>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0C2B" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <title>الصفحة غير موجودة | Page not found | أطلس الصحراء · Atlas Alshraa</title>
    <!-- The 404 page (dist/404.html). Vercel serves it, with status 404, for any path that is not a file. No React:
         static HTML and one small stylesheet, bilingual with no script (Arabic first, English below). The head script
         is the same one as in every other page (same CSP hash); data-no-intro keeps its first-visit curtain off, and
         it applies a saved dark theme. scripts/prerender.mjs fills the two contact markers at the end of each block. -->
    <link rel="icon" href="/brand/badge.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/badge.png" />
    <link rel="stylesheet" href="/src/not-found.css" />

    <script>
      // Before first paint: `js` = scripts run; `motion-ok` = the visitor allows motion; `data-loader` = the first-visit
      // intro (#al): once per tab session, never on a deep link, a crane page (data-no-intro), a hidden tab or reduced motion. The hook pays out as the
      // preloaded fonts and the hero photo arrive (the readout never runs ahead of them), then lifts the curtain. At that
      // moment data-loader goes and `atlas:loader-done` fires on window (the hero intro starts). Any key, press, wheel or
      // touch lifts it at once. It is held at most 0.95 s, never past 1.8 s after navigation (gone by 2.5 s), and dropped
      // unseen if the first frame comes after 1.2 s (slow network: no extra wait). CSS hides it by 2.5 s if this dies.
      (function (d, w) {
        var h = d.documentElement, c = h.classList;
        c.add('js');
        // The visitor's saved theme (src/lib/theme.ts). Light by default, never from the OS setting.
        try {
          localStorage.getItem('atlas-theme') == 'dark' && h.setAttribute('data-theme', 'dark');
        } catch (e) {}
        if (w.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        c.add('motion-ok');
        try {
          if (location.hash || h.hasAttribute('data-no-intro') || d.visibilityState == 'hidden' || sessionStorage.getItem('atlas-intro') || w.matchMedia('(max-width: 767px)').matches) return; // phones: no intro
          sessionStorage.setItem('atlas-intro', 1);
        } catch (e) {
          return;
        }
        h.setAttribute('data-loader', '');
        var el, n, t0, last, ok, up, img, dec, p = 0, fonts = d.querySelectorAll('link[rel=preload][as=font]'), evs = ['keydown', 'pointerdown', 'wheel', 'touchstart'];
        function on(add) {
          for (var i = 0; i < 4; i++) w[add ? 'addEventListener' : 'removeEventListener'](evs[i], skip, add ? { capture: true, passive: true } : true);
        }
        function skip() {
          lift(380);
        }
        function gone() {
          el && el.remove();
        }
        function fin() {
          dec = 2;
        }
        function lift(ms) {
          if (up) return;
          up = 1;
          on(0);
          el = el || d.getElementById('al');
          if (el && ms && el.animate) {
            el.classList.add('up');
            el.animate([{ transform: 'none' }, { transform: 'translateY(-100%)' }], { duration: ms, easing: 'cubic-bezier(.7,0,.25,1)', fill: 'forwards' });
            setTimeout(gone, ms + 60);
          } else gone();
          h.removeAttribute('data-loader');
          w.dispatchEvent(new Event('atlas:loader-done'));
        }
        function tick(now) {
          if (up) return;
          try {
            el = el || d.getElementById('al');
            if (el) {
              // First frame. Painted this late (slow network), the visitor has waited enough: drop it before it paints.
              if (!t0) {
                t0 = last = now;
                if (now > 1200) return lift(0);
                n = el.querySelector('.al-n');
              }
              var k = 0, m = fonts.length + 2, t = now - t0, i;
              for (i = 0; i < fonts.length; i++) performance.getEntriesByName(fonts[i].href).length && k++;
              img = img || d.querySelector('img[fetchpriority=high]');
              if (img ? img.complete : d.readyState != 'loading') {
                k++;
                if (!img || dec == 2) k++;
                else if (!dec) (dec = 1), img.decode ? img.decode().then(fin, fin) : fin();
              }
              p = Math.min(k / m, 1 - Math.pow(1 - Math.min(1, t / 600), 3), p + (now - last) / 300);
              last = now;
              el.style.setProperty('--p', p);
              n.textContent = Math.round(p * 100) + '%';
              if (p == 1 && !ok) (ok = now), el.classList.add('ok');
              if ((ok && now - ok > 80) || t > 950 || now > 1800) return lift(640);
            }
            requestAnimationFrame(tick);
          } catch (e) {
            lift(0);
          }
        }
        // The CSS failsafe ended (this loop never ran or stalled): release the page and hand over.
        d.addEventListener('animationend', function (e) {
          e.animationName == 'al-x' && lift(0);
        });
        on(1);
        requestAnimationFrame(tick);
      })(document, window);
    </script>
  </head>
  <body>
    <div class="nf">
      <header class="nf-top">
        <a class="nf-brand" href="/">
          <img src="/brand/badge-64.png" width="32" height="32" alt="" />
          <span lang="ar">أطلس الصحراء</span>
          <span class="nf-sep" aria-hidden="true">·</span>
          <span lang="en" dir="ltr">Atlas Alshraa</span>
        </a>
      </header>
      <main class="nf-main" id="main">
        <svg class="nf-hook" viewBox="0 0 96 168" width="96" height="168" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <g class="nf-swing">
            <path d="M48 0v54" />
            <rect x="34" y="54" width="28" height="22" rx="5" />
            <circle cx="48" cy="65" r="3.5" />
            <path d="M48 76v14" />
            <path d="M48 90v22a18 18 0 1 1-18 18" />
            <path d="M30 130l-5-9" />
          </g>
        </svg>
        <p class="nf-code" dir="ltr">404</p>
        <section class="nf-block" lang="ar" dir="rtl" aria-labelledby="nf-ar">
          <h1 id="nf-ar">هذه الصفحة غير موجودة</h1>
          <p>ربما نُقلت أو كُتب الرابط خطأ.</p>
          <div class="nf-actions">
            <a class="nf-btn nf-btn-main" href="/">العودة إلى الرئيسية</a>
            <a class="nf-btn nf-btn-line" href="/#crane-list">تصفّح الرافعات</a>
            <!--contact-ar-->
          </div>
        </section>
        <hr class="nf-rule" />
        <section class="nf-block" lang="en" dir="ltr" aria-labelledby="nf-en">
          <h2 id="nf-en">This page doesn't exist</h2>
          <p>It may have moved, or the link has a typo.</p>
          <div class="nf-actions">
            <a class="nf-btn nf-btn-main" href="/en/">Back to home</a>
            <a class="nf-btn nf-btn-line" href="/en/#crane-list">Browse cranes</a>
            <!--contact-en-->
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
