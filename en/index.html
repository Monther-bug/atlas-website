    <script>
      // Before first paint: `js` = scripts run; `motion-ok` = the visitor allows motion; `data-loader` = the first-visit
      // intro (#al): once per tab session, never on a deep link, a hidden tab or reduced motion. The hook pays out as the
      // preloaded fonts and the hero photo arrive (the readout never runs ahead of them), then lifts the curtain. At that
      // moment data-loader goes and `atlas:loader-done` fires on window (the hero intro starts). Any key, press, wheel or
      // touch lifts it at once. It is held at most 0.95 s, never past 1.8 s after navigation (gone by 2.5 s), and dropped
      // unseen if the first frame comes after 1.2 s (slow network: no extra wait). CSS hides it by 2.5 s if this dies.
      (function (d, w) {
        var h = d.documentElement, c = h.classList;
        c.add('js');
        if (w.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        c.add('motion-ok');
        try {
          if (location.hash || d.visibilityState == 'hidden' || sessionStorage.getItem('atlas-intro')) return;
          sessionStorage.setItem('atlas-intro', 1);
        } catch (e) {
          return;
        }
        h.setAttribute('data-loader', '');
        var el, n, t0, last, ok, up, img, dec, p = 0, fonts = d.querySelectorAll('link[rel=preload][as=font]'), evs = ['keydown', 'pointerdown', 'wheel', 'touchstart'];
        function on(add) {
          for (var i = 0; i < 4; i++) w[add ? 'addEventListener' : 'removeEventListener'](evs[i], skip, add ? { capture: true, passive: true } : true);
        }
        function skip() {
          lift(380);
        }
        function gone() {
          el && el.remove();
        }
        function fin() {
          dec = 2;
        }
        function lift(ms) {
          if (up) return;
          up = 1;
          on(0);
          el = el || d.getElementById('al');
          if (el && ms && el.animate) {
            el.classList.add('up');
            el.animate([{ transform: 'none' }, { transform: 'translateY(-100%)' }], { duration: ms, easing: 'cubic-bezier(.7,0,.25,1)', fill: 'forwards' });
            setTimeout(gone, ms + 60);
          } else gone();
          h.removeAttribute('data-loader');
          w.dispatchEvent(new Event('atlas:loader-done'));
        }
        function tick(now) {
          if (up) return;
          try {
            el = el || d.getElementById('al');
            if (el) {
              // First frame. Painted this late (slow network), the visitor has waited enough: drop it before it paints.
              if (!t0) {
                t0 = last = now;
                if (now > 1200) return lift(0);
                n = el.querySelector('.al-n');
              }
              var k = 0, m = fonts.length + 2, t = now - t0, i;
              for (i = 0; i < fonts.length; i++) performance.getEntriesByName(fonts[i].href).length && k++;
              img = img || d.querySelector('img[fetchpriority=high]');
              if (img ? img.complete : d.readyState != 'loading') {
                k++;
                if (!img || dec == 2) k++;
                else if (!dec) (dec = 1), img.decode ? img.decode().then(fin, fin) : fin();
              }
              p = Math.min(k / m, 1 - Math.pow(1 - Math.min(1, t / 600), 3), p + (now - last) / 300);
              last = now;
              el.style.setProperty('--p', p);
              n.textContent = Math.round(p * 100) + '%';
              if (p == 1 && !ok) (ok = now), el.classList.add('ok');
              if ((ok && now - ok > 80) || t > 950 || now > 1800) return lift(640);
            }
            requestAnimationFrame(tick);
          } catch (e) {
            lift(0);
          }
        }
        // The CSS failsafe ended (this loop never ran or stalled): release the page and hand over.
        d.addEventListener('animationend', function (e) {
          e.animationName == 'al-x' && lift(0);
        });
        on(1);
        requestAnimationFrame(tick);
      })(document, window);
    </script>
    <style>
      /* First-visit intro (#al, before #root): shown only under html[data-loader]. The curtain's lower edge is raked like
         the hero's cut (k = rise per width; it falls toward the hook side), with a navy band along it. */
      .al{display:none;--k:.46;--b:clamp(.75rem,1.8vw,1.75rem);--d:calc(var(--k)*100vw);--l:var(--d);--r:0px;position:fixed;inset:0 0 auto;z-index:99;height:calc(100vh + var(--d) + var(--b));height:calc(100lvh + var(--d) + var(--b));color:#fff}
      html[data-loader] .al{display:block;animation:al-x .3s 2.2s forwards}
      .al.up{display:block;pointer-events:none}
      [dir=ltr] .al{--l:0px;--r:var(--d)}
      @media (min-width:768px){.al{--k:.36}[lang=en] .al{--k:.5}}
      .al:before,.al:after{content:"";position:absolute;inset:0;background:var(--color-brand);clip-path:polygon(0 0,100% 0,100% calc(100% - var(--r)),0 calc(100% - var(--l)))}
      .al:after{background:var(--grad-night),var(--color-black);clip-path:polygon(0 0,100% 0,100% calc(100% - var(--r) - var(--b)),0 calc(100% - var(--l) - var(--b)))}
      .al-v{position:absolute;z-index:1;inset:0 0 auto;height:100vh;height:100svh;display:grid;place-items:center}
      .al-m{display:flex;flex-direction:column;align-items:center}
      .al-h{width:2rem;height:auto;overflow:visible;fill:var(--color-red);stroke:var(--color-red);stroke-width:3;stroke-linecap:round;transform:translateY(calc((var(--p,0) - 1)*60vh))}
      .al-h path{fill:none}
      .al-h .al-r{stroke:#fff;stroke-opacity:.4;stroke-width:1.5px;vector-effect:non-scaling-stroke;transition:stroke-opacity .2s}
      .al.ok .al-r{stroke-opacity:1}
      .al-i,.al-w,.al-t,.al-n{animation:al-in .9s cubic-bezier(.16,1,.3,1) calc(var(--i,0)*70ms) both}
      .al-i{width:clamp(4rem,3.4rem + 1.5vw,5rem);height:auto;margin-top:.25rem;border-radius:50%}
      .al-w:before,.al-t:before{content:attr(data-w)}
      .al-w{margin-top:1.25rem;font:800 clamp(2rem,1.6rem + 1.8vw,3rem)/1.25 var(--font-display)}
      [lang=en] .al-w{font-weight:700;letter-spacing:-.02em}
      .al-t{margin-top:.25rem;font:.875rem/1.4 var(--font-body);color:var(--color-neutral-400)}
      .al-n{position:absolute;inset-inline-end:clamp(1.25rem,4vw,3rem);bottom:max(1.5rem,env(safe-area-inset-bottom));min-width:4ch;text-align:end;font:.875rem/1 var(--font-body);color:var(--color-neutral-400);transition:color .2s}
      .al.ok .al-n{color:#fff}
      @keyframes al-in{from{opacity:0;transform:translateY(.75rem);filter:blur(6px)}}
      @keyframes al-x{to{opacity:0;visibility:hidden}}
    </style>
